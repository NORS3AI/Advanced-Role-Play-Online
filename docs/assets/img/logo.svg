<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ARPO emblem">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d692"/>
      <stop offset="0.5" stop-color="#d4af6a"/>
      <stop offset="1" stop-color="#a97b32"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3346"/>
      <stop offset="1" stop-color="#161b28"/>
