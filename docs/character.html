<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character · ARPO</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="index.html">
        <img src="assets/img/logo.svg" alt="">
        <span class="name"><b>ARPO</b></span>
      </a>
      <nav>
        <a class="btn btn-sm btn-ghost" href="manage.html">Manage Characters</a>
        <a class="btn btn-sm btn-primary" href="create.html">✦ Create</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="profile-wrap" id="wrap"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/export.js"></script>
  <script>
    (function () {
      var wrap = document.getElementById("wrap");
      var id = new URLSearchParams(location.search).get("id");
      var c = id ? ARPO.get(id) : null;

      if (!c) {
        wrap.innerHTML =
          '<div class="profile-missing">' +
            "<h2>Character not found</h2>" +
            "<p>This character may have been deleted, or the link is incorrect.</p>" +
            '<p style="margin-top:16px"><a class="btn btn-primary" href="manage.html">Back to your characters</a></p>' +
          "</div>";
        return;
      }

      document.title = ARPO.fullName(c) + " · ARPO";

      var toolbar = document.createElement("div");
      toolbar.className = "profile-toolbar";
      toolbar.innerHTML =
        '<a class="btn btn-sm btn-ghost" href="manage.html">&larr; All characters</a>' +
        '<span class="spacer"></span>' +
        '<a class="btn btn-sm btn-primary" href="create.html?id=' + encodeURIComponent(c.id) + '">&#9998; Edit</a>' +
        '<div class="kebab-wrap" style="position:relative">' +
          '<button class="btn btn-sm" id="save-as">Save as &#9662;</button>' +
          '<div class="menu" id="save-menu" style="right:0;top:46px">' +
            '<button data-act="png"><span class="ico">&#128444;</span> PNG image</button>' +
            '<button data-act="pdf"><span class="ico">&#128196;</span> PDF</button>' +
            '<button data-act="word"><span class="ico">&#128221;</span> Word document</button>' +
          "</div>" +
        "</div>" +
        '<button class="btn btn-sm btn-danger" id="del-btn"><span>&#128465;</span> Delete</button>';

      var host = document.createElement("div");
      host.appendChild(ARPO.buildSheet(c));

      wrap.appendChild(toolbar);
      wrap.appendChild(host);

      // Save-as dropdown
      var saveBtn = toolbar.querySelector("#save-as");
      var menu = toolbar.querySelector("#save-menu");
      saveBtn.addEventListener("click", function (e) {
        e.stopPropagation(); menu.classList.toggle("open");
      });
      menu.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-act]"); if (!b) return;
        menu.classList.remove("open");
        var act = b.getAttribute("data-act");
        if (act === "png") ARPO.exportPNG(c);
        else if (act === "pdf") ARPO.exportPDF(c);
        else if (act === "word") ARPO.exportWord(c);
      });
      document.addEventListener("click", function () { menu.classList.remove("open"); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") menu.classList.remove("open"); });

      // Delete
      toolbar.querySelector("#del-btn").addEventListener("click", function () {
        if (confirm("Delete “" + ARPO.fullName(c) + "”? This cannot be undone.")) {
          ARPO.remove(c.id);
          location.href = "manage.html";
        }
      });
    })();
  </script>
</body>
</html>
