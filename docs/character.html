<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character · ARPO</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="index.html">
        <img src="assets/img/logo.svg" alt="">
        <span class="name"><b>ARPO</b></span>
      </a>
      <nav>
        <a class="btn btn-sm btn-ghost" href="manage.html">Manage Characters</a>
        <a class="btn btn-sm btn-primary" href="create.html">✦ Create</a>
        <a class="btn btn-sm btn-ghost" href="settings.html" title="Settings" aria-label="Settings">⚙</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="profile-wrap" id="wrap"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/export.js"></script>
  <script>
    (function () {
      var wrap = document.getElementById("wrap");

      // Shared link? (#c=<payload>) — render read-only from the URL.
      var hash = location.hash || "";
      var shared = false, c = null;
      var m = hash.match(/[#&]c=([^&]+)/);
      if (m) { shared = true; c = ARPO.decodeShare(m[1]); }
      else {
        var id = new URLSearchParams(location.search).get("id");
        c = id ? ARPO.get(id) : null;
      }

      if (!c) {
        wrap.innerHTML =
          '<div class="profile-missing">' +
            "<h2>Character not found</h2>" +
            "<p>" + (shared ? "This shared link looks broken or incomplete." :
                     "This character may have been deleted, or the link is incorrect.") + "</p>" +
            '<p style="margin-top:16px"><a class="btn btn-primary" href="manage.html">Your characters</a></p>' +
          "</div>";
        return;
      }

      document.title = ARPO.fullName(c) + " · ARPO";

      var toolbar = document.createElement("div");
      toolbar.className = "profile-toolbar";

      // The Save-as dropdown is anchored to the whole toolbar (not the button),
      // so it always opens below the toolbar and never overlaps the buttons.
      var menu = document.createElement("div");
      menu.className = "menu pt-menu";
      menu.innerHTML =
        '<div class="label">Save as</div>' +
        '<button data-act="png"><span class="ico">&#128444;</span> PNG image</button>' +
        '<button data-act="pdf"><span class="ico">&#128196;</span> PDF</button>' +
        '<button data-act="word"><span class="ico">&#128221;</span> Word document</button>';

      if (shared) {
        wrap.innerHTML =
          '<div class="shared-banner">You\'re viewing a <b>shared character</b>. ' +
          "Save a copy to keep and edit it in your own collection.</div>";
        toolbar.innerHTML =
          '<a class="btn btn-sm btn-ghost" href="index.html">&larr; ARPO home</a>' +
          '<span class="spacer"></span>' +
          '<button class="btn btn-sm btn-primary" id="save-copy">&#11015; Save a copy</button>' +
          '<button class="btn btn-sm" id="save-as">Save as &#9662;</button>';
      } else {
        toolbar.innerHTML =
          '<a class="btn btn-sm btn-ghost" href="manage.html">&larr; All characters</a>' +
          '<span class="spacer"></span>' +
          '<a class="btn btn-sm btn-ghost" href="create.html?id=' + encodeURIComponent(c.id) + '">&#9998; Edit</a>' +
          '<button class="btn btn-sm btn-primary" id="share-btn">&#128279; Share</button>' +
          '<button class="btn btn-sm" id="save-as">Save as &#9662;</button>' +
          '<button class="btn btn-sm btn-danger" id="del-btn"><span>&#128465;</span> Delete</button>';
      }
      toolbar.appendChild(menu);

      var shareRow = document.createElement("div");
      shareRow.className = "share-row"; shareRow.hidden = true;
      shareRow.innerHTML = '<input id="share-url" readonly aria-label="Share link">' +
        '<button class="btn btn-sm" id="share-copy">Copy</button>';

      var host = document.createElement("div");
      host.appendChild(ARPO.buildSheet(c));

      wrap.appendChild(toolbar);
      wrap.appendChild(shareRow);
      wrap.appendChild(host);

      // Save-as dropdown
      toolbar.querySelector("#save-as").addEventListener("click", function (e) {
        e.stopPropagation(); menu.classList.toggle("open");
      });
      menu.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-act]"); if (!b) return;
        menu.classList.remove("open");
        var act = b.getAttribute("data-act");
        if (act === "png") ARPO.exportPNG(c);
        else if (act === "pdf") ARPO.exportPDF(c);
        else if (act === "word") ARPO.exportWord(c);
      });
      document.addEventListener("click", function () { menu.classList.remove("open"); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") menu.classList.remove("open"); });

      if (shared) {
        toolbar.querySelector("#save-copy").addEventListener("click", function () {
          var copy = JSON.parse(JSON.stringify(c));
          delete copy.id; delete copy.createdAt; delete copy.updatedAt;
          var saved = ARPO.upsert(copy);
          ARPO.toast("Saved to your characters");
          location.href = "character.html?id=" + encodeURIComponent(saved.id);
        });
      } else {
        var input = shareRow.querySelector("#share-url");
        toolbar.querySelector("#share-btn").addEventListener("click", function () {
          var url = ARPO.copyShare(c);
          input.value = url; shareRow.hidden = false; input.focus(); input.select();
        });
        shareRow.querySelector("#share-copy").addEventListener("click", function () {
          input.select();
          if (navigator.clipboard) navigator.clipboard.writeText(input.value).then(function () { ARPO.toast("Copied!"); });
          else { document.execCommand && document.execCommand("copy"); ARPO.toast("Copied!"); }
        });
        toolbar.querySelector("#del-btn").addEventListener("click", function () {
          if (confirm("Delete “" + ARPO.fullName(c) + "”? This cannot be undone.")) {
            ARPO.remove(c.id); location.href = "manage.html";
          }
        });
      }
    })();
  </script>
</body>
</html>
